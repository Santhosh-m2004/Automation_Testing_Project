<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopHub - Cart</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="/" class="sidebar-logo">ShopHub</a>
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
      </div>
      <nav class="sidebar-nav">
        <a href="/" class="nav-link"><i class="fas fa-home"></i> <span>Home</span></a>
        <a href="/cart.html" class="nav-link"><i class="fas fa-shopping-cart"></i> <span>Cart</span></a>
        <div id="authSidebarLinks"></div>
      </nav>
      <div class="sidebar-footer">
        <div id="authSidebarFooter"></div>
      </div>
    </aside>
    <main class="main-content">
      <div class="container">
        <div id="cartContainer" class="cart-container"><div class="loading">Loading cart...</div></div>
      </div>
    </main>
  </div>
  <script src="/js/main.js"></script>
  <script src="/js/cart.js"></script>
</body>
</html>
