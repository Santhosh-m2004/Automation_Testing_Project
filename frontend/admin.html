<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopHub - Admin</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="/" class="sidebar-logo">ShopHub</a>
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
      </div>
      <nav class="sidebar-nav">
        <a href="/" class="nav-link"><i class="fas fa-home"></i> <span>Home</span></a>
        <a href="/cart.html" class="nav-link"><i class="fas fa-shopping-cart"></i> <span>Cart</span></a>
        <div id="authSidebarLinks"></div>
      </nav>
      <div class="sidebar-footer">
        <div id="authSidebarFooter"></div>
      </div>
    </aside>
    <main class="main-content">
      <div class="container">
        <h1>Admin Dashboard</h1><div id="adminStats" class="stats-grid"></div><h2>All Orders</h2><div id="adminOrders"></div><h2>Add New Product</h2><form id="addProductForm" class="admin-form"><input type="text" id="productName" placeholder="Product Name" required><textarea id="productDesc" placeholder="Description" required></textarea><input type="number" id="productPrice" placeholder="Price" required><input type="text" id="productImage" placeholder="Image URL" required><input type="text" id="productCategory" placeholder="Category" required><input type="number" id="productStock" placeholder="Stock" required><button type="submit" class="btn btn-primary">Add Product</button></form>
      </div>
    </main>
  </div>
  <script src="/js/main.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
