<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopHub - Checkout</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="/" class="sidebar-logo">ShopHub</a>
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
      </div>
      <nav class="sidebar-nav">
        <a href="/" class="nav-link"><i class="fas fa-home"></i> <span>Home</span></a>
        <a href="/cart.html" class="nav-link"><i class="fas fa-shopping-cart"></i> <span>Cart</span></a>
        <div id="authSidebarLinks"></div>
      </nav>
      <div class="sidebar-footer">
        <div id="authSidebarFooter"></div>
      </div>
    </aside>
    <main class="main-content">
      <div class="container">
        <div class="checkout-container"><div class="checkout-form-container"><form id="checkoutForm" class="checkout-form"><div class="form-group"><label for="address">Delivery Address</label><textarea id="address" name="address" rows="3" required></textarea></div><div class="form-group"><label for="phone">Phone Number</label><input type="tel" id="phone" name="phone" required></div><button type="submit" class="btn btn-primary btn-block">Place Order</button></form></div><div class="order-summary"><h3>Order Summary</h3><div id="orderSummaryItems"></div><div class="summary-total"><span>Total:</span><span id="orderTotal">$0.00</span></div></div></div>
      </div>
    </main>
  </div>
  <script src="/js/main.js"></script>
  <script src="/js/checkout.js"></script>
</body>
</html>
