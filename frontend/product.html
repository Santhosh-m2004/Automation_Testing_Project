<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopHub - Product</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="/" class="sidebar-logo">ShopHub</a>
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
      </div>
      <nav class="sidebar-nav">
        <a href="/" class="nav-link"><i class="fas fa-home"></i> <span>Home</span></a>
        <a href="/cart.html" class="nav-link"><i class="fas fa-shopping-cart"></i> <span>Cart</span></a>
        <div id="authSidebarLinks"></div>
      </nav>
      <div class="sidebar-footer">
        <div id="authSidebarFooter"></div>
      </div>
    </aside>
    <main class="main-content">
      <div class="container">
        <div id="productDetail" class="product-detail"><div class="loading">Loading product details...</div></div><div id="reviewsSection" class="reviews-section"><h3>Customer Reviews</h3><div id="reviewsList"></div><div id="addReviewForm" style="display:none;"><h4>Write a Review</h4><select id="ratingSelect"><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option></select><textarea id="reviewComment" placeholder="Your review..."></textarea><button id="submitReviewBtn" class="btn btn-primary">Submit Review</button></div></div>
      </div>
    </main>
  </div>
  <script src="/js/main.js"></script>
  <script src="/js/product.js"></script>
</body>
</html>
