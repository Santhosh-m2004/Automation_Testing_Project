<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - ShopHub</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="/" class="sidebar-logo">ShopHub</a>
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
      </div>
      <nav class="sidebar-nav">
        <a href="/" class="nav-link"><i class="fas fa-home"></i> <span>Home</span></a>
        <a href="/cart.html" class="nav-link"><i class="fas fa-shopping-cart"></i> <span>Cart</span></a>
        <div id="authSidebarLinks"></div>
      </nav>
      <div class="sidebar-footer">
        <div id="authSidebarFooter"></div>
      </div>
    </aside>
    <main class="main-content">
      <div class="container">
        <div class="auth-container">
          <div class="auth-card">
            <h2>Create Account</h2>
            <form id="registerForm">
              <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
              </div>
              <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
              </div>
              <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="6">
              </div>
              <button type="submit" class="btn btn-primary btn-block">Register</button>
            </form>
            <p class="auth-footer">Already have an account? <a href="/login.html">Login here</a></p>
            <div id="registerMessage" class="message"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
